name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build Maya AI APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build Debug APK with Standalone Gradle 8.6
      id: build_apk
      run: |
        {
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          echo "=== Downloading Gradle 8.6 ==="
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle-8.6-bin.zip
          ./gradle-8.6/bin/gradle --version
          echo "=== Running assembleDebug ==="
          ./gradle-8.6/bin/gradle assembleDebug --stacktrace
        } 2>&1 | tee full_build.log

    - name: Report Build Log on Failure
      if: failure()
      run: |
        gh issue create \
          --title "Build Failure Log - Run #${{ github.run_number }}" \
          --body-file full_build.log
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Debug APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Maya-AI-Assistant-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create GitHub Release
      if: success() && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0.${{ github.run_number }}"
        name: "Maya AI Assistant v1.0.${{ github.run_number }}"
        draft: false
        prerelease: false
        body: |
          ### Maya AI Personal Assistant (Free & Unlimited) 🚀
          - Direct Google Gemini 1.5 Integration (Unlimited with your own free API Key)
          - Realistic ElevenLabs Voices + Offline Android TTS Fallback
          - Full Hands-Free Phone Control (Android Accessibility & Intents)
          - No 10-minute timer paywall!
          
          **Download `app-debug.apk` below and install it directly on your Android device!**
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
