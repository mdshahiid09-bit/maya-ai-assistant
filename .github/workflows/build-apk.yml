name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Maya AI APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Maya-AI-Assistant-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: "Maya AI Assistant v1.0.0"
        body: |
          ### Maya AI Personal Assistant (Free & Unlimited) 🚀
          - Direct Google Gemini 1.5 Integration (Unlimited with your own free API Key)
          - Realistic ElevenLabs Voices + Offline Android TTS Fallback
          - Full Hands-Free Phone Control (Android Accessibility & Intents)
          - No 10-minute timer paywall!
          
          **Download `app-debug.apk` below and install it directly on your Android device!**
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
