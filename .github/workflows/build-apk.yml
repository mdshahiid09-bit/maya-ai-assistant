name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build Maya AI APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses & Install Platform 34
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

    - name: Build Debug APK with Standalone Gradle 8.6
      id: build_apk
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip
        unzip -q gradle-8.6-bin.zip
        ./gradle-8.6/bin/gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee full_build.log
        BUILD_STATUS=${PIPESTATUS[0]}
        echo "GRADLE_EXIT_CODE=$BUILD_STATUS"
        if [ $BUILD_STATUS -ne 0 ]; then
          exit $BUILD_STATUS
        fi

    - name: Upload Full Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-run-${{ github.run_number }}
        path: full_build.log
        if-no-files-found: ignore

    - name: Report Build Log on Failure
      if: failure()
      run: |
        echo "### Build Failure Log (Run #${{ github.run_number }})" > issue_body.md
        echo '```' >> issue_body.md
        tail -n 150 full_build.log >> issue_body.md 2>/dev/null || echo "No log generated" >> issue_body.md
        echo '```' >> issue_body.md
        gh issue create \
          --title "Build Failure Log - Run #${{ github.run_number }}" \
          --body-file issue_body.md
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Debug APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Maya-AI-Assistant-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create GitHub Release
      if: success() && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0.${{ github.run_number }}"
        name: "Maya AI Assistant v1.0.${{ github.run_number }}"
        draft: false
        prerelease: false
        body: |
          ### Maya AI Personal Assistant (Free & Unlimited) 🚀
          - Direct Google Gemini 1.5 Integration (Unlimited with your own free API Key)
          - Realistic ElevenLabs Voices + Offline Android TTS Fallback
          - Full Hands-Free Phone Control (Android Accessibility & Intents)
          - No 10-minute timer paywall!
          
          **Download `app-debug.apk` below and install it directly on your Android device!**
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
